name: Release

# Push a version tag (git tag v1.2.3 && git push origin v1.2.3) to publish
# ghcr.io/<owner>/goodbooks:1.2.3, :1.2 and :latest for amd64 and arm64.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    # Builds each platform on its own native runner, then merges them into one multi-arch image.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
