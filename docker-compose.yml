# goodbooks on a home server. Copy this file to your server and fill in the blanks (see README).
# It holds your secrets: keep it private and back it up offsite.
services:
  app:
    image: ghcr.io/arootroatch/goodbooks:latest # or pin a release, e.g. :1.4.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:80"
    environment:
      APP_HOST: "" # The hostname people type, e.g. books.example.com. Use localhost for first-run setup.
      TIME_ZONE: "Central Time (US & Canada)" # Rails zone name; "today" rolls over at local midnight.
      SOLID_QUEUE_IN_PUMA: "true"
      # Secrets: generate all four once (README, step 2) and never change them. Keep a copy offsite.
      SECRET_KEY_BASE: "" # Signs sign-in cookies. Changing it signs everyone out; nothing is lost.
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "" # Encrypts 2FA secrets and bank tokens. Lost = locked out.
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "" # Required by Rails' encryption; set it and keep it like the others.
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "" # Mixed into the primary key. Lost = same as losing that key.
      PLAID_CLIENT_ID: "" # Optional Plaid bank feeds: set all three or none. See README.
      PLAID_SECRET: ""
      PLAID_ENV: "" # sandbox or production
    volumes:
      - goodbooks_storage:/rails/storage

volumes:
  goodbooks_storage:
    name: goodbooks_storage
