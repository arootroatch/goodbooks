# goodbooks on a home server. Copy this file and .env.example to your server (see README).
# You don't edit this file: settings go in .env, so a new release's copy can replace it as-is.
services:
  app:
    image: ghcr.io/arootroatch/goodbooks:${GOODBOOKS_VERSION:-latest} # set GOODBOOKS_VERSION in .env to pin a release
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:80"
    env_file: .env # Every setting and secret lives there (copy .env.example; see README).
    environment:
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - goodbooks_storage:/rails/storage

volumes:
  goodbooks_storage:
    name: goodbooks_storage
