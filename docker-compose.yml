services:
  app:
    build: .
    image: goodbooks:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      APP_HOST: "" # Set before deploying. See README.
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - goodbooks_storage:/rails/storage
      - ./config/master.key:/rails/config/master.key:ro

volumes:
  goodbooks_storage:
    name: goodbooks_storage
