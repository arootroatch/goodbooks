services:
  app:
    build: .
    image: goodbooks:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:3000:80"
    environment:
      APP_HOST: "" # Set before deploying. See README.
      SOLID_QUEUE_IN_PUMA: "true"
      TIME_ZONE: "Central Time (US & Canada)" # Rails zone name; "today" rolls over at local midnight.
      PLAID_CLIENT_ID: "" # Optional Plaid bank feeds: set all three or none. See README.
      PLAID_SECRET: ""
      PLAID_ENV: "" # sandbox or production
    volumes:
      - goodbooks_storage:/rails/storage
      - ./config/master.key:/rails/config/master.key:ro

volumes:
  goodbooks_storage:
    name: goodbooks_storage
